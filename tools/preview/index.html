<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健康页布局预览</title><link rel="stylesheet" href="preview.css"></head>
<body><main class="screen">
  <header><button aria-label="上个月">‹</button><div><h1>2026 年 8 月</h1><p>体重与运动日历</p></div><button aria-label="下个月">›</button></header>
  <section class="calendar"><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="grid" class="grid"></div><div class="legend"><span><i class="dot"></i>运动打卡</span><span><i class="photo"></i>体重照片</span></div></section>
  <section class="record"><div class="record-head"><div><h2>2026-08-25</h2><p>当天记录可随时补充或修改</p></div><b>已记录</b></div><div class="weight"><div><label>体重</label><div class="input">61.8 <small>kg</small></div></div><div class="photo-box">体重照片</div></div><div class="exercise"><div><strong>运动打卡</strong><small>完成后月历显示绿色标记</small></div><span class="switch"></span></div><div class="fields"><span>骑车</span><span>45 分钟</span></div><button class="save">保存当天记录</button></section>
  <section class="trend"><div class="trend-head"><div><h2>趋势对比</h2><p>62.1 → 61.8 kg，变化 -0.3 kg</p></div><div class="tabs"><b>近 7 天</b><span>本月</span></div></div><div class="metrics"><b>体重</b><span>运动时长</span></div><svg viewBox="0 0 640 240" aria-label="体重折线"><path d="M55 150 L580 90" fill="none" stroke="#176b46" stroke-width="6"/><circle cx="55" cy="150" r="8" fill="#176b46"/><circle cx="580" cy="90" r="8" fill="#176b46"/><text x="55" y="130">62.1</text><text x="580" y="70">61.8</text><text x="55" y="205">08-24</text><text x="580" y="205">08-25</text></svg><div class="summary"><div><b>1</b><span>近 7 天次数</span></div><div><b>45</b><span>近 7 天分钟</span></div><div><b>6</b><span>本月次数</span></div><div><b>240</b><span>本月分钟</span></div></div></section>
</main><script>const first=5,days=31,grid=document.querySelector('#grid');for(let i=0;i<42;i++){const d=i-first+1,cell=document.createElement('div');cell.className='day'+(d===25?' active sport':'')+(d===24?' has-weight':'');if(d>0&&d<=days){cell.innerHTML=`<span>${d}</span>${d===24?'<b>62.1 kg</b>':''}${d===25?'<b>61.8 kg</b><i class="sport-dot"></i><i class="photo-mark"></i>':''}`}grid.append(cell)}</script></body></html>
