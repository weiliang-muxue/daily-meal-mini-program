name: 问题报告
description: 报告可复现的小程序问题（禁止提交密钥和个人数据）
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除截图和日志中的 Key、Secret、Token、openid、昵称、饮食、运动、体重、照片和位置。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: 微信版本、手机系统或开发者工具版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用虚构内容，不要粘贴真实个人数据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我已确认内容不含任何密钥、口令、身份标识或个人健康数据。
          required: true
