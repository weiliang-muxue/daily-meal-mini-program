name: Validate public source

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Detect full release candidate tree
        id: source-tree
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TREE_HEAD_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$EVENT_BASE_SHA"
          case "$RELEASE_TREE_HEAD_COMMIT" in
            *[!0-9a-f]*|'') echo "Invalid release-tree head commit." >&2; exit 1;;
          esac
          if [ "${#RELEASE_TREE_HEAD_COMMIT}" -lt 40 ] || [ "${#RELEASE_TREE_HEAD_COMMIT}" -gt 64 ]; then
            echo "Invalid release-tree head commit length." >&2
            exit 1
          fi
          case "$BASE_SHA" in
            ''|0000000000000000000000000000000000000000)
              case "$DEFAULT_BRANCH" in
                *[!A-Za-z0-9._/-]*|*..*|'') echo "Invalid default Branch." >&2; exit 1;;
              esac
              git fetch --no-tags origin \
                "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
              BASE_SHA="$(git rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")"
              ;;
          esac
          case "$BASE_SHA" in
            *[!0-9a-f]*|'') echo "Invalid release-tree base commit." >&2; exit 1;;
          esac
          if [ "${#BASE_SHA}" -lt 40 ] || [ "${#BASE_SHA}" -gt 64 ]; then
            echo "Invalid release-tree base commit length." >&2
            exit 1
          fi
          RELEASE_TREE_BASE_COMMIT="$BASE_SHA" \
            node scripts/release-gate.js --source-tree-mode >> "$GITHUB_OUTPUT"

      - name: Install WeChat automator dependencies
        if: steps.source-tree.outputs.full == 'true'
        working-directory: scripts/wx-automator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test WeChat automator runtime
        if: steps.source-tree.outputs.full == 'true'
        working-directory: scripts/wx-automator
        run: npm test

      - name: Validate security bootstrap tree
        if: steps.source-tree.outputs.full != 'true'
        run: |
          node scripts/check-staged-safety.test.js
          node scripts/git-hooks.test.js
          node scripts/release-gate.test.js

      - name: Resolve the version Branch used by main
        id: release-candidate
        if: steps.source-tree.outputs.full == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION="$(node -p "require('./release-manifest.json').workingVersion")"
          CANDIDATE_REF="refs/heads/v$VERSION"
          REMOTE_REF="refs/remotes/origin/v$VERSION"
          git fetch --no-tags origin "+$CANDIDATE_REF:$REMOTE_REF"
          CANDIDATE_COMMIT="$(git rev-parse --verify "$REMOTE_REF^{commit}")"
          echo "ref=$CANDIDATE_REF" >> "$GITHUB_OUTPUT"
          echo "commit=$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Validate versions, migrations and contracts
        if: steps.source-tree.outputs.full == 'true'
        env:
          RELEASE_GATE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
          RELEASE_GATE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RELEASE_GATE_CANDIDATE_REF: ${{ steps.release-candidate.outputs.ref }}
          RELEASE_GATE_CANDIDATE_COMMIT: ${{ steps.release-candidate.outputs.commit }}
        run: node scripts/validate.js

      - name: Reject secrets and private data in published history
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref }}
        run: |
          TARGET_OID="$(git rev-parse --verify "$REF_NAME")"
          node scripts/check-staged-safety.js --range "$BEFORE_SHA" "$TARGET_OID" "$REF_NAME"

      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA" "$PR_HEAD_SHA"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --check --root -r "$PUSH_SHA"
          else
            git diff --check "$BEFORE_SHA" "$PUSH_SHA"
          fi
